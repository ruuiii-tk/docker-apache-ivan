<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Docker y Apache - Iván Ruano</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 540px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .badge {
            display: inline-block;
            background: #0284c7;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.35rem 0.8rem;
            border-radius: 9999px;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        p {
            color: #94a3b8;
            font-size: 1.05rem;
            line-height: 1.6;
            margin: 0.75rem 0;
        }
        .status {
            margin-top: 2rem;
            padding: 1rem;
            border-radius: 10px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Práctica de Aula</span>
        <h1>Iván Ruano</h1>
        <p>Servidor Apache corriendo exitosamente sobre un contenedor <strong>Docker</strong> (Debian).</p>
        <div class="status">
            ✓ Servidor Web Activo y Funcionando
        </div>
    </div>
</body>
</html>
